# Check that the SDK builds the way RStudio builds it. Tests, docs, samples, style, and API
# checks are omitted: this fork only produces the SDK for RStudio, and RStudio's own test
# suites exercise it when a new build is incorporated.
name: Quick smoke test
on:
  push:
    branches: ['rstudio/**']
  pull_request:
    branches: ['rstudio/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GWT itself into one directory
        uses: actions/checkout@v6
        with:
          path: 'gwt'
      - name: Checkout GWT tools into a sibling directory
        uses: actions/checkout@v6
        with:
          repository: 'gwtproject/tools'
          path: 'tools'
      - name: Set up JDK 17
        # RStudio builds the SDK with JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build SDK
        run: |
          set -eux
          cd gwt
          export ANT_OPTS="-Dfile.encoding=UTF-8 -Xmx2g"
          ant clean dist-dev
